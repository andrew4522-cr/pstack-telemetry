[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pstack-telemetry"
version = "1.0.0"
description = "Self-Healing Agent Harness, Canonical TSV Decision Trails (/show-me-your-work), 3-Lens Reflection (/reflect) & Pre-Send Governance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Andrew Anderson", email = "andrew@cult.rent" }
]
keywords = ["ai-agents", "telemetry", "self-healing", "pstack", "mcp", "outreach-governance", "llm-ops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://www.bridgingtheaigap.com"
Repository = "https://github.com/andrew4522-cr/pstack-telemetry"

[project.scripts]
pstack-telemetry = "pstack_telemetry.core:main"
